name: Review readiness
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to recheck (also refreshes timeout/inline replies)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: review-check-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  review-check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      # Never execute PR code in this privileged workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Evaluate trusted review receipts and publish head status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
          REVIEW_TRIGGERS: ${{ vars.REVIEW_TRIGGERS }}
          REVIEW_STATE_MARKER: ${{ vars.REVIEW_STATE_MARKER }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          head="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          result=0
          node scripts/pr/review-check.mjs "$PR" || result=$?
          state=pending
          description="Reviews pending; see Review readiness logs"
          if [ "$result" = 0 ]; then
            state=success
            description="Both current-head reviews completed; findings answered"
          elif [ "$result" = 3 ]; then
            state=failure
            description="Manual review required: timeout or recurring finding"
          fi
          gh api "repos/$GH_REPO/statuses/$head" --method POST \
            -f "state=$state" -f context=review-readiness -f "description=$description"
          exit "$result"
