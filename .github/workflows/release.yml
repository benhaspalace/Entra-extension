name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: extension-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-actionlint.sh
      - run: npm run ci
      - id: version
        name: Require a versioned release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_REF" = "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/extension-${{ steps.version.outputs.version }}.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: store-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release
      - name: Verify the exact build artifact
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attach verified artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --generate-notes
          fi
          gh release upload "v$VERSION" "release/extension-$VERSION.zip" release/SHA256SUMS --clobber
      - name: 'PLACEHOLDER: Chrome Web Store and Edge Add-ons APIs'
        run: echo "Store API publishing is not configured. Owner must provision credentials and approval."
